name: Deploy HF Face API

on:
  push:
    branches: [main]
    paths:
      - "hf-face-api/**"
      - ".github/workflows/deploy-hf-face-api.yml"
  workflow_dispatch:

jobs:
  sync-to-hugging-face:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push hf-face-api to Hugging Face Space
        uses: huggingface/hub-sync@main
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ secrets.HF_SPACE_ID }}
          repo_type: space
          token: ${{ secrets.HF_TOKEN }}
          source_folder: hf-face-api
